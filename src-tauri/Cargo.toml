[package]
name = "messenger-pwa-tauri"
version = "1.0.0"
description = "Facebook Messenger Tauri Wrapper (WebKitGTK + Tauri)"
authors = ["Natalie"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = "0.18"
webkit2gtk = "2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
opt-level = "s"
strip = true